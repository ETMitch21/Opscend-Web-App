@if (userIsLoggedIn && !standalonePublicRoute) {
    <app-shell
        class="session-protected-shell"
        [class.session-protected-shell--concealed]="sessionIdle.locked()"
        [attr.inert]="sessionIdle.locked() ? '' : null"
        [attr.aria-hidden]="sessionIdle.locked() ? 'true' : null">
    </app-shell>
    @if (sessionIdle.locked()) {
        <app-session-lock></app-session-lock>
    }
} @else {
    <router-outlet />
}

@if (!userIsLoggedIn || !sessionIdle.locked()) {
    <ngx-sonner-toaster position="top-right" [expand]="false" [visibleToasts]="4" [toastOptions]="toastOptions" />
}
