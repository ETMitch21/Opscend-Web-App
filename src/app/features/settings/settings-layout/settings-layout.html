<div class="settings-shell">
  <header class="settings-page-header">
    <div class="settings-page-header-copy">
      <a [routerLink]="resolvedBackRoute()" class="settings-back-link cursor-pointer">
        <lucide-icon [img]="icons.ArrowLeft" [size]="15"></lucide-icon>
        {{ resolvedBackLabel() }}
      </a>

      <h1 class="settings-title">{{ resolvedTitle() }}</h1>
      @if (resolvedDescription()) {
        <p class="settings-description">{{ resolvedDescription() }}</p>
      }
    </div>

    <div class="settings-header-actions">
      <ng-content select="[settings-actions]"></ng-content>
    </div>
  </header>

  <section class="settings-content">
    <ng-content></ng-content>
  </section>
</div>
